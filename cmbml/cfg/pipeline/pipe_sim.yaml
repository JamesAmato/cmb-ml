check_hydra_configs:  # No information needed here

make_noise_cache:
  assets_out:
    scale_cache:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{freq}_noise_sd_map.fits"
  assets_in:
    noise_src_varmaps: {stage: raw}
  dir_name: Simulation_B_NoiseCache

make_cosmo_configs:
  assets_out:
    split_configs:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/{split}/split_config.yaml"
    cosmo_config:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cosmo_params.yaml"
      path_template_alt: "{root}/{dataset}/{working}{stage}/{split}/cosmo_params.yaml"
  assets_in:
    wmap_chains: {stage: raw}
  splits: &all_splits
    - train
    - valid
    - test
  dir_name: Simulation_C_Configs
  make_stage_log: True

make_fg_configs:
  assets_out:
    fg_config:
      handler: Config
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/fg_params.yaml"
      path_template_alt: "{root}/{dataset}/{working}{stage}/{split}/fg_params.yaml"
  splits: *all_splits
  dir_name: Simulation_C_Configs
  make_stage_log: False

make_theory_ps:
  assets_out:
    cmb_ps:
      handler: CambPowerSpectrum
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_ps_fid.txt"
      path_template_alt: &pta "{root}/{dataset}/{working}{stage}/{split}/cmb_ps_fid.txt"
    cmb_ps_planck:
      handler: PandasCAMBPowerSpectrum
      path_template: *pta
      path_template_alt: *pta
  assets_in:
    cosmo_config: {stage: make_cosmo_configs}
    planck_ps: {stage: raw, orig_name: planck_ps_pandas_camb}
  splits: *all_splits
  dir_name: Simulation_CMB_Power_Spectra
  make_stage_log: True

make_obs_no_noise:
  assets_out:
    cmb_map:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/cmb_map_fid.fits"
    sky_no_noise_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/sky_{freq}_no_noise_map.fits"
  assets_in:
    cmb_ps: {stage: make_theory_ps}
    # fg_config: {stage: make_fg_configs}
  splits: *all_splits
  dir_name: Simulation_D_Sky_Emission
  make_stage_log: True
  # top_level_working: True

make_noise:
  assets_out:
    noise_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/noise_{freq}_map.fits"
      path_template_alt: "{root}/{dataset}/{working}{stage}/{split}/noise_{freq}_map.fits"
  assets_in:
    deltabandpass: {stage: raw}
    planck_deltabandpass: {stage: raw}
    scale_cache: {stage: make_noise_cache}
    noise_model: {stage: make_noise_models}
    noise_avg:   {stage: make_planck_noise_sims_avgs}
  dir_name: Simulation_E_Noise
  splits: *all_splits
  make_stage_log: True

make_sims:
  assets_out:
    obs_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{stage}/{split}/{sim}/obs_{freq}_map.fits"
    cmb_map:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{stage}/{split}/{sim}/cmb_map_fid.fits" 
  assets_in:
    # deltabandpass: {stage: raw}
    noise_maps: {stage: make_noise}
    sky_no_noise_maps: {stage: make_obs_no_noise}
    cmb_map: {stage: make_obs_no_noise}
  dir_name: Simulation
  splits: *all_splits
  make_stage_log: True
  top_level_working: True

make_hm_noise:
  assets_out:
    noise_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{working}{stage}/{split}/{sim}/noise_{freq}_map_hm{hm}.fits"
      path_template_alt: "{root}/{dataset}/{working}{stage}/{split}/noise_{freq}_map_hm{hm}.fits"
  assets_in:
    deltabandpass: {stage: raw}
    planck_deltabandpass: {stage: raw}
    scale_cache: {stage: make_noise_cache}
    noise_model: {stage: make_noise_models}
    noise_avg:   {stage: make_planck_noise_sims_avgs}
  dir_name: Simulation_E2_HM_Noise
  splits: &hm
    - test
    - valid
  make_stage_log: False

make_hm_sims:
  assets_out:
    obs_maps:
      handler: HealpyMap
      path_template: "{root}/{dataset}/{stage}/{split}/{sim}/obs_{freq}_map_hm{hm}.fits"
  assets_in:
    noise_maps: {stage: make_hm_noise}
    # sky_no_noise_maps: {stage: make_obs_no_noise, working: *sw}
    sky_no_noise_maps: {stage: make_obs_no_noise}
  dir_name: Simulation_HM_Maps
  splits: *hm
  make_stage_log: False
  top_level_working: True

