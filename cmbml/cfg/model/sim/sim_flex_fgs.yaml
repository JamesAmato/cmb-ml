defaults:
  - cmb:   wmap_cosmo_means_broad
  # - noise: noise_empty  # Array of zeros
  # - noise: anisotropic  # "Variance"
  # - noise: correlated   # "Variance with induced correlations"
  - noise: stationary   # "Variance with induced correlations and stationary stuff"
# PySM needs to run internal calculations at a resolution greater than the output nside (output nside set in experiment.yaml)

# PySM3 recommends either nside_sky=2048 for output_nside <= 1024; otherwise double it
#    While debugging code, it is often convenient to use lower resolution nside_sky
#    Only one of the two should be set. The other should be "null". Setting both may given unexpected results.
# Moved to top level for now
nside_sky            : 2048
nside_sky_factor     : null
sky_unit             : MJy/sr

# Moved to top level for now
component_objects:
  - cmb
  - noise
seed_base_string: cmb_ml
# seed_base_string: ${dataset_name}
do_bandpass_int_each_sim : false
min_obs_beam             : ${min_obs_beam_fwhm}
include_cmb              : true  # Defaults to true if not included. Will still produce power spectra, only affects making sky and observations.
downgrade_lmax           : 1280

# Use constant fg refers to the same fgs across all simulation splits
use_constant_fg          : true
preset_strings           : ["f1", "a1", "co1", "cib1", "ksz1", "tsz1"]

fg_seed_template: "{split}_{sim}_{fg_str}_{fg_param}"

# See https://galsci.github.io/blog/2022/common-fiducial-sky/ and https://galsci.github.io/blog/2022/common-fiducial-extragalactic-cmb/ for more suggestions
# These parameters are pulled directly from the PySM3 configs, with the exception of the "dist" sub-dicts, which enable replacing scalars with random draws.
fgs:
  # {}  # {} is used when no other entries are included. This is nice for testing.
  d11:
    # Need to use a patched version of the dust model
    class : "flexsky.FlexDust"
    amplitude_modulation_temp_alm : "dust_gnilc/raw/gnilc_dust_temperature_modulation_alms_lmax768.fits.gz"
    amplitude_modulation_pol_alm : "dust_gnilc/raw/gnilc_dust_polarization_modulation_alms_lmax768.fits.gz"
    largescale_alm : "dust_gnilc/raw/gnilc_dust_largescale_template_logpoltens_alm_nside2048_lmax1024_complex64.fits.gz"
    small_scale_cl : "dust_gnilc/raw/gnilc_dust_small_scales_logpoltens_cl_lmax16384.fits.gz"
    largescale_alm_mbb_index : "dust_gnilc/raw/gnilc_dust_largescale_template_beta_alm_nside2048_lmax1024.fits.gz"
    small_scale_cl_mbb_index : "dust_gnilc/raw/gnilc_dust_small_scales_beta_cl_lmax16384_2023.06.06.fits.gz"
    largescale_alm_mbb_temperature : "dust_gnilc/raw/gnilc_dust_largescale_template_Td_alm_nside2048_lmax1024.fits.gz"
    small_scale_cl_mbb_temperature : "dust_gnilc/raw/gnilc_dust_small_scales_Td_cl_lmax16384_2023.06.06.fits.gz"
    freq_ref : "353 GHz"
    # Remove the galplane_fix option to skip applying the galactic plane fix
    galplane_fix : "dust_gnilc/raw/gnilc_dust_galplane.fits.gz"
    galplane_fix_beta_Td : "dust_gnilc/raw/gnilc_dust_beta_Td_galplane.fits.gz"
    # Configuration for reproducing d10
    # synalm_lmax : 16384
    # max_nside : 8192
    dist:
      # seeds : [8192,777,888]
      seeds: {draw: Seed, n: 3}  # n is the number of seeds taken by ModifiedBlackBodyRealization
  s6:
    # Need to use a patched version of the synchrtron model
    class : "flexsky.FlexPowerLaw"
    largescale_alm : "synch/raw/synch_largescale_template_logpoltens_alm_lmax128_2023.02.24.fits.gz"
    amplitude_modulation_temp_alm : "synch/raw/synch_temperature_modulation_alms_lmax64_2023.02.24.fits.gz"
    amplitude_modulation_pol_alm : "synch/raw/synch_polarization_modulation_alms_lmax64_2023.02.24.fits.gz"
    amplitude_modulation_beta_alm : "synch/raw/synch_amplitude_modulation_alms_lmax768.fits.gz"
    small_scale_cl : "synch/raw/synch_small_scales_cl_lmax16384_2023.02.24.fits.gz"
    largescale_alm_pl_index : "synch/raw/synch_largescale_beta_alm_nside512_lmax768.fits.gz"
    small_scale_cl_pl_index : "synch/raw/synch_small_scales_beta_cl_lmax16384.fits.gz"
    freq_ref : "23 GHz"
    max_nside : 8192
    # Remove the galplane_fix option to skip applying the galactic plane fix
    galplane_fix : "synch/raw/synch_galplane.fits.gz"
    # Configuration for reproducing s5
    # synalm_lmax : 16384
    dist:
      # seeds : [555,444]
      seeds: {draw: Seed, n: 2}  # n is the number of seeds taken by PowerLawRealization
